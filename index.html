<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <h1>Password Generator</h1>
    <p>Create secure passwords instantly</p>

    <div class="output-box">
      <input type="text" id="password" readonly>
      <button class="copy-btn" onclick="copyPassword()">📋</button>
    </div>

    <label>
      Password Length:
      <span id="lengthValue">12</span>
    </label>

    <input
      type="range"
      id="length"
      min="6"
      max="30"
      value="12"
    >

    <div class="options">
      <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
      <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
      <label><input type="checkbox" id="numbers" checked> Numbers</label>
      <label><input type="checkbox" id="symbols" checked> Symbols</label>
    </div>

    <button class="generate-btn" onclick="generatePassword()">
      Generate Password
    </button>

    <div class="strength">
      Strength:
      <span id="strengthText">Strong</span>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
